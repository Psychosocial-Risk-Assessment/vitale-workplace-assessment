<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Configuração do Questionário — Vitale</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="brand">
  <img
    src="assets/logodeitado.png"
    alt="Vitale"
    onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'brand__fallback',innerHTML:'<span class=\'v-mark\'></span>VITALE'}))"
  />
</div>

<main class="admin-shell">
  <div class="admin-head">
    <h1>Configuração do Questionário</h1>
    <p>Configure os dados da empresa para gerar o link que será enviado aos colaboradores.</p>
  </div>

  <div class="admin-card">

    <div class="field">
      <label for="company">Empresa</label>

      <div class="field-input-wrap">
        <span class="field-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 21V6a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v15" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 21V9a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v12" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 9h1M9 13h1M9 17h1M17 12h1M17 16h1" stroke-linecap="round"/>
          </svg>
        </span>

        <input
          type="text"
          id="company"
          placeholder="Ex.: Empresa ABC Ltda."
          autocomplete="off"
        />
      </div>
    </div>

    <p class="error-msg" id="error-msg">
      Informe o nome da empresa antes de gerar o link.
    </p>

    <div class="field">
      <label for="questionnaire">Tipo de Questionário</label>

      <select id="questionnaire">
        <option value="copsoq3">COPSOQ III</option>
        <option value="hse-it-indoor">HSE-IT Indoor</option>
        <option value="hse-it-outdoor">HSE-IT Outdoor</option>
      </select>
    </div>

    <button class="btn-primary" id="generate-btn">
      Gerar Link

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="link-result" id="link-result">
      <p class="link-result__label">
        Link para enviar aos funcionários
      </p>

      <div class="link-result__box">
        <input type="text" id="link-output" readonly />
        <button id="copy-btn">Copiar</button>
      </div>

      <p class="link-result__hint" id="link-hint">
        Envie este link por WhatsApp, e-mail ou QR code. Funciona em celular e computador.
      </p>
    </div>

  </div>
</main>

<script src="app-admin.js"></script>

</body>
</html>
